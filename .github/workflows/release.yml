name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build-and-release:
    permissions:
      contents: write # Required to create and edit releases

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      # tauri-action runs `npm run build` (from tauri.conf.json beforeBuildCommand),
      # compiles the Rust app, and creates/updates the GitHub Release.
      # bundle.targets in tauri.conf.json controls per-OS artifacts (nsis on Windows; deb + appimage on Linux).
      - name: Build and Release Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip linuxdeploy's internal `strip` step — its bundled binutils chokes on
          # `.relr.dyn` sections emitted by newer toolchains. Harmless on Ubuntu 22.04
          # today, but spares debugging if the runner image is ever updated.
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DivePlay ${{ github.ref_name }}'
          releaseBody: 'Download the Desktop App installer or the portable standalone Web player below.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # After Tauri builds, dist/index.html is fresh. Rename it and upload the portable web HTML.
      - name: Prepare Web Version
        run: Copy-Item dist/index.html dist/diveplay-web.html
        shell: pwsh

      - name: Upload Web HTML to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/diveplay-web.html
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
