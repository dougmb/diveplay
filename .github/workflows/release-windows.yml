name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build, e.g. v1.0.12'
        required: true
        type: string

jobs:
  build-windows:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          tagName: ${{ inputs.tag_name }}
          releaseName: 'DivePlay ${{ inputs.tag_name }}'
          releaseBody: 'Windows desktop installer build.'
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag_name, '-') }}
